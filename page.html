<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Data Saver</title>
    <style>
        /* --- CSS (Design ke liye) --- */
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f4f4f9;
        }
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 300px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-group input {
            width: 90%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #218838;
        }
        pre {
            background: #333;
            color: #fff;
            padding: 15px;
            border-radius: 5px;
            max-width: 500px;
            overflow-x: auto;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="input-group">
            <label>Name:</label>
            <input type="text" id="userName" placeholder="Enter name">
        </div>
        <div class="input-group">
            <label>Age:</label>
            <input type="number" id="userAge" placeholder="Enter age">
        </div>
        <button id="submitBtn">Submit</button>
    </div>

    <h3>Data Array (Live Output):</h3>
    <pre id="output">[]</pre>

    <script>
        // 1. Khali array banaya jisme data save hoga
        let userData = [];
        let idCounter = 1; // ID shuru karne ke liye

        // 2. HTML elements ko select kiya
        const nameInput = document.getElementById('userName');
        const ageInput = document.getElementById('userAge');
        const submitBtn = document.getElementById('submitBtn');
        const outputDisplay = document.getElementById('output');

        // 3. Button click hone par kya hoga
        submitBtn.addEventListener('click', function() {
            const nameValue = nameInput.value.trim();
            const ageValue = ageInput.value.trim();

            // Validation: Agar fields khali hain toh alert dikhayein
            if (nameValue === "" || ageValue === "") {
                alert("Please fill both Name and Age!");
                return;
            }

            // 4. Naya user object banaya jaisa aapko chahiye tha
            const newUser = {
                id: idCounter < 10 ? `0${idCounter}` : `${idCounter}`, // '01', '02' format ke liye
                name: nameValue,
                age: ageValue
            };

            // 5. Object ko array mein push (add) kar diya
            userData.push(newUser);

            // Counter ko 1 badha diya agle user ke liye
            idCounter++;

            // 6. Screen par array ko sundar tarike se print kiya
            outputDisplay.textContent = JSON.stringify(userData, null, 2);

            // 7. Inputs ko khali kar diya agli entry ke liye
            nameInput.value = "";
            ageInput.value = "";
        });
    </script>

</body>
</html>
